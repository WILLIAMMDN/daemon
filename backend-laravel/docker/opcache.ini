; OPcache para producción (Render). Sin él, PHP recompila los archivos de
; Laravel en cada request y el boot toma ~1 s; con esta configuración el
; boot baja a ~100-200 ms.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.max_wasted_percentage=5
; revalidate_freq=2: los deploys de Render copian archivos nuevos; PHP los
; detecta a los 2 s sin necesidad de reiniciar Apache.
opcache.revalidate_freq=2
opcache.validate_timestamps=1
opcache.save_comments=1
opcache.fast_shutdown=1
