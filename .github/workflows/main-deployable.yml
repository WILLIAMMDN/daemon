name: Main is deployable

# Reemplaza al antiguo deploy automatico en cada merge. Verifica que el
# commit de main puede desplegarse a produccion, pero NO despliega nada:
# main queda desplegable, no desplegado. La unica via de mutacion
# productiva es `.github/workflows/deploy-production.yml`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-deployable-${{ github.sha }}
  cancel-in-progress: false

jobs:
  deployable:
    name: deployable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@11.16.0 --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
        working-directory: frontend-angular

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend-angular

      - name: Validate production environment and deployment contract
        run: node scripts/check-environment-safety.mjs --ci

      - name: Verify no user uploads leak into the public build
        run: npm run check:public-assets
        working-directory: frontend-angular

      - name: Production build
        run: npm run build
        working-directory: frontend-angular

      - name: Report deployability
        run: |
          {
            echo "## main desplegable"
            echo
            echo "El commit \`${GITHUB_SHA}\` construye y cumple el contrato de entornos."
            echo
            echo "**No se ha desplegado nada.** Para publicarlo en produccion ejecuta"
            echo "el workflow *Deploy production* con \`commit_sha=${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
