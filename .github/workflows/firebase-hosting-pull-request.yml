name: Validate Firebase Hosting build on PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  build_without_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@11.16.0 --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps
        working-directory: frontend-angular

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend-angular

      - name: Test environment isolation and frontend
        run: npm run test:ci
        working-directory: frontend-angular

      - name: Build production artifact without deployment
        run: npm run build
        working-directory: frontend-angular
